name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,bidi]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: fanoos --help
