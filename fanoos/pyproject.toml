[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanoos"
version = "0.2.0"
description = "Fanoos (فانوس): a bilingual Persian/English AI portfolio critic and career coach for UI/UX and web designers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Negar Zahed" }]
keywords = ["ai-agent", "portfolio", "ux", "design", "grok", "xai", "persian", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "openai>=1.99",
    "httpx>=0.27",
    "pypdf>=4.0",
    "rich>=13.7",
]

[project.optional-dependencies]
bidi = ["python-bidi>=0.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
fanoos = "fanoos.cli:main"

[project.urls]
Homepage = "https://github.com/zahednegar-hub/fanoos"
Issues = "https://github.com/zahednegar-hub/fanoos/issues"

[tool.setuptools]
packages = ["fanoos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
